<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'none'"><title>Spotify library</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="playlists.css"></head><body class="settings-page playlist-page"><header><h1>Your music</h1><p>Play your playlists, liked songs or favorite artists.</p></header><div class="playlist-tools"><button id="connect">Connect / reconnect</button><button id="refresh">Refresh</button></div><label for="device">Play on</label><select id="device"><option value="">Active Spotify device</option></select><div class="playlist-tools"><button id="switchDevice">Switch playback to device</button></div><label for="volume">Volume · active device</label><div class="volume-controls"><input id="volume" type="range" min="0" max="100" value="50"><output id="volumeValue">50%</output><button id="setVolume">Set volume</button></div><nav class="library-tabs" aria-label="Music category"><button data-view="playlists" aria-pressed="true">Playlists</button><button data-view="liked" aria-pressed="false">Liked Songs</button><button data-view="artists" aria-pressed="false">Artists</button></nav><div id="likedActions" class="playlist-tools" hidden><button id="playPage">Play this page</button><button id="openLiked">Open full Liked Songs in Spotify</button></div><label for="filter" id="filterLabel">Filter loaded playlists</label><input id="filter" type="search" placeholder="Playlist or owner"><button id="searchLibrary" hidden>Search artists</button><p id="status" role="status" aria-live="polite"></p><div id="playlists" class="playlist-list"></div><button id="previousPage" hidden>Previous page</button><button id="more" hidden>Load more</button><p class="playlist-note">Playback control requires Spotify Premium. Keep Spotify open on your playback device.</p><script src="playlists.js"></script></body></html>
